name: 01- 🎬 Youtube Downloader

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        required: true
        type: string
      quality:
        default: 'best'
        type: string
      split_threshold_mb:
        default: '90'
        type: string

jobs:
  download-youtube:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # ✅ WARP روی host اجرا میشه
      - name: Start WARP
        run: |
          docker run -d \
            --name warp \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            caomingjun/warp

          for i in {1..15}; do
            RESULT=$(curl -s --max-time 5 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace || true)
            if echo "$RESULT" | grep -q "warp="; then
              echo "✅ WARP ready"
              break
            fi
            sleep 2
          done

      # ✅ اجرای yt-dlp داخل Docker image
      - name: Run Downloader in Container
        run: |
          docker run --rm \
            --network host \
            -v $PWD:/workspace \
            ghcr.io/aceclasher3/ytdlp-runtime:latest \
            bash -c '
              set -e

              URL="${{ github.event.inputs.youtube_url }}"
              QUALITY="${{ github.event.inputs.quality }}"
              SPLIT_MB="${{ github.event.inputs.split_threshold_mb }}"
              SPLIT_BYTES=$((SPLIT_MB * 1024 * 1024))

              mkdir -p videos tmp

              case "$QUALITY" in
                audio) FORMAT="bestaudio" ;;
                best) FORMAT="bestvideo+bestaudio/best" ;;
                1080) FORMAT="bestvideo[height<=1080]+bestaudio/best" ;;
                720) FORMAT="bestvideo[height<=720]+bestaudio/best" ;;
                480) FORMAT="bestvideo[height<=480]+bestaudio/best" ;;
                *) FORMAT="best" ;;
              esac

              yt-dlp \
                --proxy "socks5://127.0.0.1:1080" \
                --format "$FORMAT" \
                --merge-output-format mp4 \
                --output "tmp/%(title)s.%(ext)s" \
                --no-playlist \
                --retries 10 \
                --fragment-retries 10 \
                "$URL"

              for FILE in tmp/*; do
                [ -f "$FILE" ] || continue
                SIZE=$(stat -c%s "$FILE")
                NAME=$(basename "$FILE")

                if [ "$SPLIT_BYTES" -gt 0 ] && [ "$SIZE" -gt "$SPLIT_BYTES" ]; then
                  cd tmp
                  zip -0 -s "${SPLIT_MB}m" "../videos/${NAME}.zip" "$NAME"
                  cd ..
                else
                  mv "$FILE" "videos/$NAME"
                fi
              done
            '

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add videos
          git commit -m "YouTube download [skip ci]" || exit 0
          git push

      - name: Stop WARP
        if: always()
        run: |
          docker stop warp || true
          docker rm warp || true
